<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{TITLE}} · 脉脉</title>
<style>
:root{--blue:#0759ed;--ink:#172441;--muted:#62748d;--line:#e0e7f1;--paper:#f2f5fa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei",Arial,sans-serif;font-size:15px;line-height:1.75}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #8caaff;outline-offset:5px}.wrap{width:min(1040px,calc(100% - 48px));margin:auto}.topbar{padding:24px 0;display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:800;letter-spacing:2px;color:var(--blue)}.label{font-size:12px;color:var(--muted);letter-spacing:1px}.hero{background:var(--blue);color:white;border-radius:22px;padding:34px 38px;margin-bottom:18px}.eyebrow{font-size:13px;letter-spacing:3px;opacity:.8}h1{font-size:34px;line-height:1.3;margin:12px 0 0}.context{color:var(--muted);font-size:13px;margin:0 4px 24px}.context:empty{display:none}h2,h3,h4,h5,p{margin-top:0}.company-card{background:white;border:1px solid var(--line);border-radius:20px;padding:28px;margin-bottom:28px}.company-heading{display:flex;gap:12px;align-items:center;margin-bottom:20px}.company-heading h2{font-size:24px;line-height:1.4;margin:0}.number{border-radius:7px;background:#edf3ff;color:var(--blue);font-size:13px;font-weight:700;padding:3px 9px}.lead-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.lead-grid>section{min-width:0;padding:23px;border-radius:15px;border:1px solid #cdddf9;background:#eef4ff}.lead-grid>.people{background:#edf8f4;border-color:#cce8dc}.lead-grid h3{font-size:20px;margin:0 0 17px;line-height:1.4}.lead-grid h3:before{content:"";display:inline-block;width:4px;height:18px;background:var(--blue);margin-right:9px;border-radius:3px;vertical-align:-2px}.people h3:before{background:#148467}ul{list-style:none;padding:0;margin:0}li+li{border-top:1px solid #d7e2f3;margin-top:22px;padding-top:22px}.people li+li{border-color:#cfe4dc}.main-link{font-size:17px;font-weight:650;line-height:1.65;overflow-wrap:anywhere}.source-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85;margin:11px 0 14px}.byline,.scope,.status{font-size:13px;color:#52647e;margin:8px 0}.status{color:#6f602c}.person-role{margin:7px 0 11px;font-size:15px;font-weight:600}.lead-button{display:inline-block;margin-top:10px;padding:7px 14px;border:1px solid #afc7f3;border-radius:8px;background:#fff;font-size:14px;font-weight:650}.people .lead-button{color:#087356;border-color:#a5d4c3}.people-search-button{font-size:16px;padding:11px 18px;margin-top:0}.associated-jobs{margin-top:25px;border-top:1px solid var(--line);padding-top:20px}.associated-jobs>h3{font-size:16px;color:var(--muted);margin:0 0 14px}.job-item{border:1px solid #e6ebf3;border-radius:11px;padding:17px 19px;background:#fafbfd}.job-item+.job-item{margin-top:12px}.job-heading{display:flex;align-items:baseline;justify-content:space-between;gap:16px}.job-heading h4{font-size:17px;line-height:1.5;margin:0;overflow-wrap:anywhere}.salary{color:var(--blue);font-size:17px;font-weight:650;white-space:nowrap}.facts{font-size:13px;color:var(--muted);margin:7px 0 0}.note{background:#fff7e8;color:#87642a;font-size:12px;border-radius:7px;padding:9px 12px;margin:12px 0 0}.job-details{margin-top:12px}.job-details summary{font-size:13px;color:var(--blue);cursor:pointer;font-weight:600}.job-detail{margin-top:17px}.job-detail h5{font-size:13px;color:var(--muted);margin-bottom:7px}.job-detail .source-text{font-size:14px}.publisher{font-size:12px;color:var(--muted);margin:14px 0}.apply-row{text-align:right;margin-top:18px}.fallback-button{font-family:inherit;cursor:pointer;display:block;width:100%;padding:16px 22px;border:1px solid var(--blue);border-radius:12px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;line-height:1.65;text-align:center;overflow-wrap:anywhere;box-shadow:0 6px 16px rgba(7,89,237,.16)}.fallback-button:hover{background:#064ac7;border-color:#064ac7;text-decoration:none}.empty .fallback-button{margin-top:20px}.apply-button{display:inline-block;color:white;background:var(--blue);border-radius:8px;padding:8px 18px;font-size:14px;font-weight:600}.muted{color:var(--muted);font-size:13px}.skills{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 28px;margin:28px 0}.skills h2{font-size:19px;line-height:1.5;margin:0 0 12px}.skills h2:before{content:"";display:inline-block;width:4px;height:18px;border-radius:3px;background:var(--blue);margin-right:10px;vertical-align:-2px}.skills p{margin-bottom:0}table{border-collapse:collapse;width:100%;margin-top:17px;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted)}.empty{padding:30px;border-radius:12px;background:#fff}.brand-footer{background:#e8f0ff;border:1px solid #d4e1fb;border-radius:18px;padding:28px 32px;margin:30px 0 22px}.brand-footer h2{font-size:25px;margin:0 0 8px}.brand-footer p{font-size:14px;color:var(--muted);margin:0}.footer{font-size:12px;color:var(--muted);text-align:center;padding:0 10px 30px}.footer p{margin:4px 0}
.download-dialog{position:fixed;width:min(400px,calc(100% - 32px));max-height:calc(100dvh - 40px);overflow:auto;border:0;border-radius:20px;padding:30px 28px 26px;background:#fff;color:var(--ink);text-align:center;box-shadow:0 22px 70px rgba(13,31,63,.28)}.download-dialog::backdrop{background:rgba(13,31,63,.58);backdrop-filter:blur(3px)}.download-dialog h2{font-size:23px;line-height:1.4;margin:10px 0 18px}.download-dialog p{font-size:14px;line-height:1.8;margin:0;color:var(--muted)}.download-dialog-close{position:absolute;top:10px;right:10px;width:36px;height:36px;border:0;border-radius:50%;background:#f2f5fa;color:#42546e;font-size:26px;line-height:1;cursor:pointer}.download-qr{display:block;width:min(260px,100%);height:auto;margin:0 auto 18px;object-fit:contain}
@media(max-width:650px){.wrap{width:calc(100% - 28px)}.topbar{padding:20px 3px}.label{font-size:11px}.hero{padding:27px 23px;border-radius:17px}h1{font-size:27px}.company-card{padding:20px 16px}.company-heading h2{font-size:22px}.lead-grid{grid-template-columns:1fr;gap:14px}.lead-grid>section{padding:20px}.job-heading{display:block}.salary{display:block;margin-top:6px}.job-item{padding:15px}.skills{padding:21px 18px}.brand-footer{padding:25px 23px}.apply-button,.people-search-button{width:100%;text-align:center}.fallback-button{padding:15px 16px;font-size:16px}}
@media print{body{background:white}.wrap{width:100%}.hero,.lead-grid>section,.brand-footer{print-color-adjust:exact;-webkit-print-color-adjust:exact}.job-item{break-inside:avoid}}
/* skill-intro:start */
.brand-footer.skill-intro{display:flex;align-items:center;justify-content:space-between;gap:28px}.skill-intro-copy{flex:1;min-width:0}.brand-footer .skill-intro-lead{font-size:17px;font-weight:700;color:var(--ink);line-height:1.8;margin:0 0 12px}.skill-intro-copy>p:last-child{font-size:14px;line-height:1.9;margin:0}.skill-download-button{flex:none;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;min-height:46px;padding:11px 22px;border-radius:9px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;text-decoration:none}.skill-download-button:hover{background:#0048d1;text-decoration:none}.skill-download-button:focus-visible{outline:3px solid #8caaff;outline-offset:5px}@media(max-width:650px){.brand-footer.skill-intro{flex-direction:column;align-items:stretch;gap:20px}.skill-download-button{width:100%}.brand-footer .skill-intro-lead{font-size:16px}}
/* skill-intro:end */
</style></head><body><main class="wrap">
<header class="topbar"><span class="brand">脉脉</span><span class="label">白领求职捷径</span></header>
<section class="hero"><div class="eyebrow">内推 · 公司人脉 · 关联岗位</div><h1>{{TITLE}}</h1></section>
<p class="context">{{CONTEXT}}</p>
<section aria-label="公司内推与人脉清单">{{CARDS}}</section>
<section aria-label="清单末尾的技能关键词">{{SKILLS}}</section>
<section class="brand-footer skill-intro" aria-label="白领求职捷径skill介绍">
<div class="skill-intro-copy"><p class="skill-intro-lead">“白领求职捷径skill”是一款面向产研运、市场、财法政等白领求职者的Skill。</p>
<p>用户安装skill之后，输入目标城市、公司、岗位、或者期望薪资，即可获得一份包含公司内推帖、公司人脉、岗位详情、技能关键词的机会清单。用户可进入脉脉查看原帖、了解员工或直接投递。</p></div>
<a class="skill-download-button" href="https://github.com/yaoyiyi0828/Hana-AI-1" target="_blank" rel="noopener noreferrer">前往下载skill</a>
</section>
<footer class="footer"><p>内推范围与当前意愿以对方确认为准；公司员工身份不代表内推承诺。</p><p>岗位状态与详情以脉脉站内页面为准。</p></footer>
</main>
{{DOWNLOAD_DIALOG}}
<script>
(() => {
  const dialog = document.getElementById('maimai-download-dialog');
  if (!dialog) return;
  let trigger = null;
  document.addEventListener('click', event => {
    const opener = event.target.closest?.('[data-open-download-dialog]');
    if (!opener) return;
    trigger = opener;
    if (!dialog.open) dialog.showModal();
  });
  dialog.querySelector('[data-close-download-dialog]').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => {
    if (event.target !== dialog) return;
    const bounds = dialog.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) dialog.close();
  });
  dialog.addEventListener('close', () => {
    if (trigger?.isConnected) trigger.focus();
  });
})();
</script>
</body></html>
